<!DOCTYPE html>

<title>Portfolio — Menu</title>
<link rel="stylesheet" href="style.css">

<body>

  <!-- TOP ZONE: dense field of glitching holographic bars + glitching red hairlines,
      Heat-palette (+ blue tones), white bg. All 22 shapes (18 bars + 4 lines) swap
       slots via script.js; hovering a shape freezes every other shape in place and
       lets only the hovered one keep glitching. -->
  <div class="bar-zone" id="barZone">
    <div class="grain" aria-hidden="true"></div>
    <div class="bars" id="bars">
      <!-- 22 slots, 22 shapes (18 bars + 4 static-red-but-now-mobile hairlines) -->
      <div class="slot" data-slot="0"><div class="shape bar" data-shape="0"></div></div>
      <div class="slot" data-slot="1"><div class="shape bar" data-shape="1"></div></div>
      <div class="slot" data-slot="2"><div class="shape line" data-shape="2"></div></div>
      <div class="slot" data-slot="3"><div class="shape bar" data-shape="3"></div></div>
      <div class="slot" data-slot="4"><div class="shape bar" data-shape="4"></div></div>

      <div class="slot" data-slot="6"><div class="shape line" data-shape="6"></div></div>
      <div class="slot" data-slot="7"><div class="shape bar" data-shape="7"></div></div>
      <div class="slot" data-slot="8"><div class="shape bar" data-shape="8"></div></div>
      <div class="slot" data-slot="9"><div class="shape bar" data-shape="9"></div></div>
      <div class="slot" data-slot="10"><div class="shape line" data-shape="10"></div></div>
      <div class="slot" data-slot="11"><div class="shape bar" data-shape="11"></div></div>

      <div class="slot" data-slot="15"><div class="shape bar" data-shape="14"></div></div>

      <div class="slot" data-slot="21"><div class="shape bar" data-shape="21"></div></div>
    </div>
  </div>
