<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP ZONE: dense field of glitching holographic bars + glitching red hairlines,
      Heat-palette (+ blue tones), white bg. All 22 shapes (18 bars + 4 lines) swap
       slots via script.js; hovering a shape freezes every other shape in place and
       lets only the hovered one keep glitching. -->
  <!-- Full-page faint preview shown behind everything while a project title
       in the nav below is hovered/focused; toggled by project-preview.js.
       Three stacked layers (image / looping video / live-site iframe) all
       stay mounted and ready so switching between them is instant. -->
  <div class="project-preview" id="projectPreview" aria-hidden="true">
    <div class="preview-layer preview-layer-image" id="previewImageLayer"></div>
    <video
      class="preview-layer preview-layer-video"
      id="previewTreeVideo"
      muted
      loop
      autoplay
      playsinline
      disablepictureinpicture
      preload="auto">
      <source src="assets/media/giron_tree_07.MP4" type="video/mp4">
    </video>
    <iframe
      class="preview-layer preview-layer-iframe"
      id="previewLaIframe"
      src="https://robertsgiron.github.io/To-Live-and-Die-in-LA/"
      title="To Live and Die in LA — live site preview"
      tabindex="-1"
      aria-hidden="true"></iframe>
  </div>

  <div class="bar-zone" id="barZone">
    <div class="grain" aria-hidden="true"></div>
    <div class="bars" id="bars">
      <!-- 22 slots, 22 shapes (18 bars + 4 static-red-but-now-mobile hairlines) -->
      <div class="slot" data-slot="0"><div class="shape bar" data-shape="0"></div></div>
      <div class="slot" data-slot="1"><div class="shape bar" data-shape="1"></div></div>
      <div class="slot" data-slot="2"><div class="shape line" data-shape="2"></div></div>
      <div class="slot" data-slot="3"><div class="shape bar" data-shape="3"></div></div>
      <div class="slot" data-slot="4"><div class="shape bar" data-shape="4"></div></div>
      <div class="slot" data-slot="5"><div class="shape bar" data-shape="5"></div></div>
      <div class="slot" data-slot="6"><div class="shape line" data-shape="6"></div></div>
      <div class="slot" data-slot="7"><div class="shape bar" data-shape="7"></div></div>
      <div class="slot" data-slot="8"><div class="shape bar" data-shape="8"></div></div>
      <div class="slot" data-slot="9"><div class="shape bar" data-shape="9"></div></div>
      <div class="slot" data-slot="10"><div class="shape line" data-shape="10"></div></div>
      <div class="slot" data-slot="11"><div class="shape bar" data-shape="11"></div></div>
      <div class="slot" data-slot="12"><div class="shape bar" data-shape="12"></div></div>
      <div class="slot" data-slot="13"><div class="shape bar" data-shape="13"></div></div>
      <div class="slot" data-slot="14"><div class="shape line" data-shape="17"></div></div>
      <div class="slot" data-slot="15"><div class="shape bar" data-shape="14"></div></div>
      <div class="slot" data-slot="16"><div class="shape bar" data-shape="15"></div></div>
      <div class="slot" data-slot="17"><div class="shape bar" data-shape="16"></div></div>
      <div class="slot" data-slot="18"><div class="shape bar" data-shape="18"></div></div>
      <div class="slot" data-slot="19"><div class="shape bar" data-shape="19"></div></div>
      <div class="slot" data-slot="20"><div class="shape bar" data-shape="20"></div></div>
      <div class="slot" data-slot="21"><div class="shape bar" data-shape="21"></div></div>
    </div>
  </div>

  <!-- CENTERED CONTENT: everything here is centered except the bars above and the fixed contact footer -->
  <main class="content">
    <a class="video-frame" href="about.html" id="bioLink" aria-label="View bio">
      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        disablepictureinpicture
        preload="auto">
        <source src="assets/hero-loop.mp4" type="video/mp4">
      </video>
    </a>
    <p class="bio-caption">click here for bio</p>

    <nav class="track-list" aria-label="Projects">
      <a class="track" href="tree-of-light.html" data-preview-layer="previewTreeVideo">Tree of Light</a>
      <a class="track" href="to-live-and-die-in-la.html" data-preview-layer="previewLaIframe">To Live and Die in LA</a>
      <a class="track" href="metamorphosis.html" data-preview="assets/media/giron_metamorphosis_01.JPG">Metamorphosis</a>
      <a class="track" href="goodbye-horses.html" data-preview="https://img.youtube.com/vi/ieznKdvSUJ4/hqdefault.jpg">Goodbye Horses</a>
          <a class="track" href="audioworks.html" data-preview="assets/audio works 24'-26'/giron_audio_01.png">Audio Works '24-'26</a>
      <a class="track" href="mpc-logo.html" data-preview="assets/media/giron_mpc_03.png">Music Production Club</a>
    </nav>
  </main>
  <script src="video-playback.js"></script>
  <script src="script.js"></script>
  <script src="project-preview.js"></script>
  <div class="site-copyright">
  <img src="assets/copyright-mark.png" alt="Copyright mark">
  <span>Robert Giron 2026</span>
</div>
</body>
</html>
