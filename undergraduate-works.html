<!DOCTYPE html>
<html lang="en">
<head>

<title>Undergraduate Works — Robert Giron</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="index.html">&larr; home</a>

  <!-- Full-page faint preview shown behind everything while a project title
       in the nav below is hovered/focused; toggled by project-preview.js.
       Three stacked layers (image / looping video / live-site iframe) all
       stay mounted and ready so switching between them is instant. -->
  <div class="project-preview" id="projectPreview" aria-hidden="true">
    <div class="preview-layer preview-layer-image" id="previewImageLayer"></div>
    <video
      class="preview-layer preview-layer-video"
      id="previewTreeVideo"
      muted
      loop
      autoplay
      playsinline
      disablepictureinpicture
      preload="auto">
      <source src="assets/media/giron_tree_07.MP4" type="video/mp4">
    </video>
    <iframe
      class="preview-layer preview-layer-iframe"
      id="previewLaIframe"
      src="https://robertsgiron.github.io/To-Live-and-Die-in-LA/"
      title="To Live and Die in LA — live site preview"
      tabindex="-1"
      aria-hidden="true"></iframe>
  </div>

  <!-- CENTERED CONTENT: everything here is centered except the fixed contact footer -->
  <main class="content">
    <nav class="track-list" aria-label="Projects">
      <a class="track" href="tree-of-light.html" data-preview-layer="previewTreeVideo">Tree of Light</a>
      <a class="track" href="to-live-and-die-in-la.html" data-preview-layer="previewLaIframe">To Live and Die in LA</a>
      <a class="track" href="metamorphosis.html" data-preview="assets/media/giron_metamorphosis_01.JPG">Metamorphosis</a>
      <a class="track" href="goodbye-horses.html" data-preview="https://img.youtube.com/vi/ieznKdvSUJ4/hqdefault.jpg">Goodbye Horses</a>
          <a class="track" href="audioworks.html" data-preview="assets/audio works 24'-26'/giron_audio_01.jpg">Audio Works '24-'26</a>
      <a class="track" href="mpc-logo.html" data-preview="assets/media/giron_mpc_03.png">Music Production Club</a>
    </nav>
  </main>
  <script src="video-playback.js"></script>
  <script src="project-preview.js"></script>
  <div class="site-copyright">
  <img src="assets/copyright-mark.png" alt="Copyright mark">
  <span>Robert Giron 2026</span>
</div>
</body>
</html>
